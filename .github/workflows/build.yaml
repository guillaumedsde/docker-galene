on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@70313223e2665c3211b454b3fea6534624e78d64
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestation(s) with GitHub OIDC Token
      packages: write # to publish Docker image to GHCR #FIXME
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64
      cache: true
      cache-mode: "max"
      meta-images: ${{ github.repository }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
